# Storefront — nginx snippet (performance)

Drop-in config for the vhost whose `root` is `<base>/storefront` (see
[`04-deployment.md`](./04-deployment.md), "Satukan keempat app di bawah satu induk").

It addresses two PageSpeed audits that cannot be fixed from the app code,
because they are HTTP-level:

- **"Enable text compression"** — the JS/CSS is shipped uncompressed without this.
- **"Use efficient cache policy"** — hashed assets get no `Cache-Control` today.

## Apply

1. Paste the `gzip …` block at the top level of the **`http`** context (e.g. a
   drop-in under `/etc/nginx/conf.d/compression.conf` so a package update cannot
   remove it), or inside the storefront `server { }` before the `location`s.
2. Paste the `location` blocks into the storefront `server { }`.
3. `sudo nginx -t && sudo systemctl reload nginx`.

Verify:

```bash
curl -sI https://<domain>/assets/ | grep -i "content-encoding\|cache-control"
curl -sI https://<domain>/ | grep -i cache-control   # index.html: no-cache
```

## Snippet

```nginx
# ── Compression (http context, or inside the storefront server block) ─────────
gzip on;
gzip_vary on;
gzip_comp_level 6;
gzip_min_length 1024;
gzip_proxied any;
gzip_types
    text/plain
    text/css
    text/xml
    application/javascript
    application/json
    application/xml
    image/svg+xml
    font/woff2;

# If nginx is built with the brotli module, prefer it (same types):
# brotli on;
# brotli_comp_level 5;
# brotli_types text/plain text/css application/javascript application/json image/svg+xml font/woff2;

server {
    # … existing listen / server_name / TLS / root <base>/storefront; …

    # SPA fallback: unknown paths serve the shell, which boots the router.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Hashed build assets never change — cache them for a year, immutable.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
        try_files $uri =404;
    }

    # The HTML shell must be revalidated on every request, or a deploy keeps
    # serving the previous bundle's hashed filenames.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }
}
```

> Self-hosted fonts (`/assets/*.woff2`, hashed) are covered by the `/assets/`
> block above — one year, immutable — so repeat visits never refetch them.
