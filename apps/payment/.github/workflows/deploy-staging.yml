name: Deploy Staging

on:
  push:
    branches: [staging]

jobs:
  deploy:
    name: Build & deploy to staging VPS
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
        env:
          VITE_API_BASE_URL: ${{ secrets.STAGING_VITE_API_BASE_URL }}
          # Reverb (Pusher protocol) — embedded into the client bundle at build.
          # HOST must be the PUBLIC WebSocket hostname the browser reaches,
          # SCHEME=https and PORT=443 behind a TLS reverse proxy.
          VITE_REVERB_APP_KEY: ${{ secrets.STAGING_VITE_REVERB_APP_KEY }}
          VITE_REVERB_HOST: ${{ secrets.STAGING_VITE_REVERB_HOST }}
          VITE_REVERB_PORT: ${{ secrets.STAGING_VITE_REVERB_PORT }}
          VITE_REVERB_SCHEME: ${{ secrets.STAGING_VITE_REVERB_SCHEME }}

      - name: Deploy via rsync
        uses: burnett01/rsync-deployments@7.0.1
        with:
          switches: -avzr --delete
          path: dist/
          remote_path: ${{ secrets.STAGING_DEPLOY_PATH }}
          remote_host: ${{ secrets.STAGING_SSH_HOST }}
          remote_port: ${{ secrets.STAGING_SSH_PORT }}
          remote_user: ${{ secrets.STAGING_SSH_USER }}
          remote_key: ${{ secrets.STAGING_SSH_PRIVATE_KEY }}
