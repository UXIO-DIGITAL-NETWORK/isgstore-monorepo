name: Production

on:
  push:
    branches: [main]
  workflow_dispatch: {}

concurrency:
  group: production-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Lint, Test, Build & Deploy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      # Gate the deploy on the suite. A failing step aborts the job, so a red
      # test never reaches the rsync below — the whole point of running it here
      # rather than only on pull requests.
      - name: Test
        run: npm run test

      - name: Build
        run: npm run build
        env:
          VITE_API_BASE_URL: ${{ secrets.VITE_API_BASE_URL }}
          # Hosted Pusher (pusher.com) — embedded into the client bundle at build.
          # Only the public app key + cluster; the secret never ships to the client.
          VITE_PUSHER_APP_KEY: ${{ secrets.VITE_PUSHER_APP_KEY }}
          VITE_PUSHER_APP_CLUSTER: ${{ secrets.VITE_PUSHER_APP_CLUSTER }}
          # Google Sign-In OAuth Client ID. Public by design (it ships inside the
          # client bundle), so it is committed here rather than kept as a secret.
          # Must match the API's GOOGLE_CLIENT_ID.
          VITE_GOOGLE_CLIENT_ID: "84646436486-4mbhi3c5ssavqcnjoqincf2f10k6abbm.apps.googleusercontent.com"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: production-build
          path: dist
          retention-days: 7

      - name: Install deploy SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p "${{ secrets.SSH_PORT }}" "${{ secrets.SSH_HOST }}" >> ~/.ssh/known_hosts

      - name: Sync build to server
        run: |
          rsync -avz --delete \
            -e "ssh -i ~/.ssh/deploy_key -p ${{ secrets.SSH_PORT }}" \
            dist/ "${{ secrets.SSH_USERNAME }}@${{ secrets.SSH_HOST }}:/home/uxioserver1/web-topup-uxiotopup-provider/fe/"

      - name: Reload nginx
        run: |
          ssh -i ~/.ssh/deploy_key -p "${{ secrets.SSH_PORT }}" "${{ secrets.SSH_USERNAME }}@${{ secrets.SSH_HOST }}" \
            "sudo systemctl reload nginx"

      - name: Clean up deploy key
        if: always()
        run: rm -f ~/.ssh/deploy_key

      # Both notifications are best-effort: `continue-on-error` plus the trailing
      # `|| true` keep a Discord outage from turning a good deploy red, and an
      # unset webhook URL simply no-ops (dev forks have no secret).
      - name: Notify Discord — deploy succeeded
        if: success()
        continue-on-error: true
        env:
          DISCORD_URL: ${{ secrets.DISCORD_WEBHOOK_LOG_URL }}
          GH_ACTOR: ${{ github.actor }}
          GH_REF: ${{ github.ref_name }}
          GH_SHA: ${{ github.sha }}
          GH_RUN_ID: ${{ github.run_id }}
          GH_REPO: ${{ github.repository }}
        run: |
          [ -z "$DISCORD_URL" ] && exit 0
          curl -sf -o /dev/null -X POST "$DISCORD_URL" \
            -H "Content-Type: application/json" \
            -d "{\"embeds\":[{\"title\":\"✅ Storefront Deploy Succeeded\",\"description\":\"**${GH_SHA:0:7}** on **${GH_REF}** deployed by **${GH_ACTOR}**\nhttps://github.com/${GH_REPO}/actions/runs/${GH_RUN_ID}\",\"color\":5763719,\"footer\":{\"text\":\"Uxio System Auto-Log\"}}]}" || true

      - name: Notify Discord — deploy failed
        if: failure()
        continue-on-error: true
        env:
          DISCORD_URL: ${{ secrets.DISCORD_WEBHOOK_LOG_URL }}
          GH_ACTOR: ${{ github.actor }}
          GH_REF: ${{ github.ref_name }}
          GH_SHA: ${{ github.sha }}
          GH_RUN_ID: ${{ github.run_id }}
          GH_REPO: ${{ github.repository }}
        run: |
          [ -z "$DISCORD_URL" ] && exit 0
          curl -sf -o /dev/null -X POST "$DISCORD_URL" \
            -H "Content-Type: application/json" \
            -d "{\"embeds\":[{\"title\":\"❌ Storefront Deploy Failed\",\"description\":\"**${GH_ACTOR}** — deploy of **${GH_SHA:0:7}** on **${GH_REF}** failed!\nhttps://github.com/${GH_REPO}/actions/runs/${GH_RUN_ID}\",\"color\":15548997,\"footer\":{\"text\":\"Uxio System Auto-Log\"}}]}" || true
