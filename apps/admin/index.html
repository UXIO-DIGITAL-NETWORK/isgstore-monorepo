<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!--
      The theme, applied before first paint.

      `class="dark"` used to be hardcoded on <html>, while the React provider
      applies the real choice in an effect that runs after paint — so a session
      that had chosen light flashed dark on every cold load. This reads the same
      localStorage key the provider does; the two must stay in step.
    -->
    <script>
      (function () {
        try {
          var stored = localStorage.getItem("vite-ui-theme");
          var dark =
            stored === "dark" ||
            ((!stored || stored === "system") && window.matchMedia("(prefers-color-scheme: dark)").matches);
          document.documentElement.classList.add(dark ? "dark" : "light");
        } catch (e) {
          document.documentElement.classList.add("dark");
        }
      })();
    </script>
    <link
      rel="icon"
      type="image/svg+xml"
      href="/vite.svg"
    />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />
    <meta
      http-equiv="X-UA-Compatible"
      content="ie=edge"
    />

    <!-- Meta Tags for SEO -->
    <meta
      name="description"
      content="UDN Admin Dashboard — internal back-office console for managing the UDN multi-game top-up platform: dashboard analytics, financial oversight, and transaction operations."
    />
    <meta
      name="subject"
      content="UDN Admin Dashboard"
    />
    <meta
      name="keywords"
      content="UDN, admin dashboard, top-up platform, transaction management, financial oversight"
    />
    <meta
      name="author"
      content="Muhammad Sufyan"
    />
    <meta
      name="robots"
      content="noindex, nofollow"
    />

    <title>UDN Admin Dashboard</title>
  </head>
  <body>
    <div id="root"></div>
    <script
      type="module"
      src="/src/main.tsx"
    ></script>
  </body>
</html>
