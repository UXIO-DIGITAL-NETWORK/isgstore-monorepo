name: Deploy Production

on:
  push:
    branches: [main]

jobs:
  deploy:
    name: Build & deploy to production VPS
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
        env:
          VITE_API_BASE_URL: ${{ secrets.PROD_VITE_API_BASE_URL }}

      - name: Deploy via rsync
        uses: burnett01/rsync-deployments@7.0.1
        with:
          switches: -avzr --delete
          path: dist/
          remote_path: ${{ secrets.PROD_DEPLOY_PATH }}
          remote_host: ${{ secrets.PROD_SSH_HOST }}
          remote_port: ${{ secrets.PROD_SSH_PORT }}
          remote_user: ${{ secrets.PROD_SSH_USER }}
          remote_key: ${{ secrets.PROD_SSH_PRIVATE_KEY }}

