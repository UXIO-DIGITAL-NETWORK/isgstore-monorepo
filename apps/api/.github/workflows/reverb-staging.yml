name: Reverb Staging

# Runs automatically AFTER "Deploy API to Staging" finishes successfully.
# Additive only — the existing deploy workflow is not modified. Registers and
# (re)starts the staging Reverb server (port 8081) under Supervisor.
on:
  workflow_run:
    workflows: ["Deploy API to Staging"]
    types:
      - completed

jobs:
  reverb:
    name: Register & (re)start Reverb (Supervisor)
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    steps:
      - name: Reverb via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.STAGING_HOST }}
          username: ${{ secrets.STAGING_USERNAME }}
          key: ${{ secrets.STAGING_SSH_KEY }}
          port: ${{ secrets.STAGING_PORT }}
          script: |
            set -e

            # 1. Copy the (new) supervisor program config into place.
            sudo cp /home/uxioserver1/web-topup/api/staging/supervisor/laravel-reverb-staging.conf \
                    /etc/supervisor/conf.d/laravel-reverb-staging.conf

            # 2. Make sure supervisord is up (idempotent — no-op if already running).
            if ! sudo systemctl is-active --quiet supervisor; then
              sudo systemctl restart supervisor
              sleep 2
            fi

            # 3. Register the program, then (re)start it so it loads new code.
            sudo supervisorctl reread
            sudo supervisorctl update
            sudo supervisorctl restart laravel-reverb-staging:* || sudo supervisorctl start laravel-reverb-staging:*

            # 4. Show status for the run log.
            sudo supervisorctl status laravel-reverb-staging:*

      - name: Notify Discord — Reverb restart failed
        if: failure()
        continue-on-error: true
        env:
          DISCORD_URL: ${{ secrets.DISCORD_WEBHOOK_LOG_URL }}
          GH_REPO: ${{ github.repository }}
          GH_RUN_ID: ${{ github.run_id }}
        run: |
          [ -z "$DISCORD_URL" ] && exit 0
          curl -sf -o /dev/null -X POST "$DISCORD_URL" \
            -H "Content-Type: application/json" \
            -d "{\"embeds\":[{\"title\":\"❌ Staging Reverb Restart Failed\",\"description\":\"Reverb supervisor step failed after a staging deploy.\nhttps://github.com/${GH_REPO}/actions/runs/${GH_RUN_ID}\",\"color\":15548997,\"footer\":{\"text\":\"Uxio System Auto-Log\"}}]}" || true
