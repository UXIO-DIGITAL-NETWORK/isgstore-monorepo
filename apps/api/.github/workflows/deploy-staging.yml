name: Deploy API to Staging

on:
  push:
    branches:
      - staging # Workflow otomatis berjalan saat ada push/merge ke branch staging
  workflow_dispatch:

jobs:
  test:
    name: Run Test Suite
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP 8.4
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: sqlite3, pdo_sqlite
          coverage: none

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist

      - name: Prepare test environment
        run: |
          cp .env.example .env
          php artisan key:generate

      # Test suite uses in-memory SQLite (phpunit.xml) — no services needed.
      - name: Run tests
        run: php artisan test

      - name: Notify Discord — tests failed
        if: failure()
        continue-on-error: true
        env:
          DISCORD_URL: ${{ secrets.DISCORD_WEBHOOK_LOG_URL }}
          GH_ACTOR: ${{ github.actor }}
          GH_REF: ${{ github.ref_name }}
          GH_RUN_ID: ${{ github.run_id }}
          GH_REPO: ${{ github.repository }}
        run: |
          [ -z "$DISCORD_URL" ] && exit 0
          curl -sf -o /dev/null -X POST "$DISCORD_URL" \
            -H "Content-Type: application/json" \
            -d "{\"embeds\":[{\"title\":\"❌ Staging Tests Failed\",\"description\":\"**${GH_ACTOR}** — test suite failed on **${GH_REF}**\nhttps://github.com/${GH_REPO}/actions/runs/${GH_RUN_ID}\",\"color\":15548997,\"footer\":{\"text\":\"Uxio System Auto-Log\"}}]}" || true

  deploy:
    name: Deploy to Staging VPS
    runs-on: ubuntu-latest
    needs: test # Deploy hanya berjalan jika seluruh test suite hijau
    steps:
      - name: Notify Discord — deploy started
        continue-on-error: true
        env:
          DISCORD_URL: ${{ secrets.DISCORD_WEBHOOK_LOG_URL }}
          GH_ACTOR: ${{ github.actor }}
          GH_REF: ${{ github.ref_name }}
          GH_SHA: ${{ github.sha }}
          GH_RUN_ID: ${{ github.run_id }}
          GH_REPO: ${{ github.repository }}
        run: |
          [ -z "$DISCORD_URL" ] && exit 0
          curl -sf -o /dev/null -X POST "$DISCORD_URL" \
            -H "Content-Type: application/json" \
            -d "{\"embeds\":[{\"title\":\"🚀 Staging Deploy Started\",\"description\":\"**${GH_ACTOR}** deploying **${GH_SHA:0:7}** on **${GH_REF}**\nhttps://github.com/${GH_REPO}/actions/runs/${GH_RUN_ID}\",\"color\":16705372,\"footer\":{\"text\":\"Uxio System Auto-Log\"}}]}" || true

      - name: Execute Deployment Commands via SSH
        uses: appleboy/ssh-action@v1.0.3
        env:
          # Mengambil data .env dari GitHub Secrets
          ENV_FILE_CONTENT: ${{ secrets.STAGING_ENV_FILE }}
        with:
          host: ${{ secrets.STAGING_HOST }}
          username: ${{ secrets.STAGING_USERNAME }}
          key: ${{ secrets.STAGING_SSH_KEY }}
          port: ${{ secrets.STAGING_PORT }}
          envs: ENV_FILE_CONTENT
          script: |
            # 0. Bootstrap: clone repo on first deploy if staging dir isn't a git repo yet
            STAGING_DIR="/home/uxioserver1/web-topup/api/staging"
            if [ ! -d "$STAGING_DIR/.git" ]; then
              echo "First-time setup: removing stale dir and cloning repo into $STAGING_DIR..."
              rm -rf "$STAGING_DIR"
              git clone git@github.com:UXIO-DIGITAL-NETWORK/web-topup-api.git "$STAGING_DIR"
              git -C "$STAGING_DIR" checkout staging
            fi

            # 1. Masuk ke direktori staging yang tepat
            cd /home/uxioserver1/web-topup/api/staging

            # 2. Tarik kode terbaru dari branch staging
            git pull origin staging

            # 3. Tulis ulang file .env dari GitHub Secrets
            echo "$ENV_FILE_CONTENT" > .env

            # 4. Install dependensi (mengabaikan interaksi manual)
            composer install --no-interaction --prefer-dist --optimize-autoloader

            # 5. Jalankan migrasi database
            php artisan migrate --force

            # 6. Bersihkan dan buat ulang cache konfigurasi
            php artisan optimize:clear
            php artisan config:cache
            php artisan route:cache

            # 7. Pastikan symlink storage publik ada (logo kategori, banner)
            php artisan storage:link || true

            # 8. Pastikan permission tetap aman setelah file baru turun
            sudo chown -R uxioserver1:www-data /home/uxioserver1/web-topup/api/staging
            sudo chmod -R 775 /home/uxioserver1/web-topup/api/staging/storage
            sudo chmod -R 775 /home/uxioserver1/web-topup/api/staging/bootstrap/cache

            # 9. Pasang cron Laravel scheduler (idempotent, spesifik per environment).
            # Tanpa ini payments:sync-expired & digiflazz:sync-products tidak pernah jalan.
            CRON_ENTRY="* * * * * cd /home/uxioserver1/web-topup/api/staging && php artisan schedule:run >> /dev/null 2>&1"
            ( crontab -l 2>/dev/null | grep -vF "web-topup/api/staging && php artisan schedule:run" ; echo "$CRON_ENTRY" ) | crontab -
            echo "Scheduler cron installed:"
            crontab -l | grep "schedule:run"

            # 10. Install supervisor jika belum ada
            if ! command -v supervisorctl &> /dev/null; then
              echo "Supervisor not found — installing..."
              sudo apt-get update -qq
              sudo apt-get install -y -qq supervisor
              sudo systemctl enable supervisor
            else
              echo "Supervisor already installed — skipping install"
            fi

            # 11. Pastikan direktori conf.d ada
            sudo mkdir -p /etc/supervisor/conf.d

            # 12. Deploy supervisor config untuk queue worker
            # (dilakukan sebelum daemon start/health-check di bawah — config yang salah
            # di conf.d bisa membuat seluruh supervisord gagal start, jadi config terbaru
            # harus sudah ter-copy sebelum kita mencoba (re)start daemonnya)
            sudo cp /home/uxioserver1/web-topup/api/staging/supervisor/laravel-queue-staging.conf \
                    /etc/supervisor/conf.d/laravel-queue-staging.conf

            # Pastikan daemon supervisord benar-benar berjalan (idempotent — no-op jika sudah up).
            # Binary bisa saja sudah terpasang tapi daemonnya mati/belum pernah dijalankan.
            if ! sudo systemctl is-active --quiet supervisor; then
              echo "supervisord not running — starting..."
              sudo systemctl restart supervisor
              sleep 2
            fi

            if [ ! -S /var/run/supervisor.sock ]; then
              echo "ERROR: supervisor.sock still missing after start attempt — check 'systemctl status supervisor' / 'journalctl -u supervisor' on the host."
              exit 1
            fi

            # 13. Reload supervisor agar membaca config terbaru
            sudo supervisorctl reread
            sudo supervisorctl update

            # 14. Restart queue worker agar muat kode yang baru di-deploy
            # (queue:work meng-cache kode — harus restart setiap deploy)
            sudo supervisorctl restart laravel-queue-staging:*

      - name: Notify Discord — deploy succeeded
        if: success()
        continue-on-error: true
        env:
          DISCORD_URL: ${{ secrets.DISCORD_WEBHOOK_LOG_URL }}
          GH_ACTOR: ${{ github.actor }}
          GH_REF: ${{ github.ref_name }}
          GH_SHA: ${{ github.sha }}
          GH_RUN_ID: ${{ github.run_id }}
          GH_REPO: ${{ github.repository }}
        run: |
          [ -z "$DISCORD_URL" ] && exit 0
          curl -sf -o /dev/null -X POST "$DISCORD_URL" \
            -H "Content-Type: application/json" \
            -d "{\"embeds\":[{\"title\":\"✅ Staging Deploy Succeeded\",\"description\":\"**${GH_SHA:0:7}** on **${GH_REF}** deployed by **${GH_ACTOR}**\nhttps://github.com/${GH_REPO}/actions/runs/${GH_RUN_ID}\",\"color\":5763719,\"footer\":{\"text\":\"Uxio System Auto-Log\"}}]}" || true

      - name: Notify Discord — deploy failed
        if: failure()
        continue-on-error: true
        env:
          DISCORD_URL: ${{ secrets.DISCORD_WEBHOOK_LOG_URL }}
          GH_ACTOR: ${{ github.actor }}
          GH_REF: ${{ github.ref_name }}
          GH_SHA: ${{ github.sha }}
          GH_RUN_ID: ${{ github.run_id }}
          GH_REPO: ${{ github.repository }}
        run: |
          [ -z "$DISCORD_URL" ] && exit 0
          curl -sf -o /dev/null -X POST "$DISCORD_URL" \
            -H "Content-Type: application/json" \
            -d "{\"embeds\":[{\"title\":\"❌ Staging Deploy Failed\",\"description\":\"**${GH_ACTOR}** — deploy of **${GH_SHA:0:7}** on **${GH_REF}** failed!\nhttps://github.com/${GH_REPO}/actions/runs/${GH_RUN_ID}\",\"color\":15548997,\"footer\":{\"text\":\"Uxio System Auto-Log\"}}]}" || true