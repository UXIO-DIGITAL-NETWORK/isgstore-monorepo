name: Deploy API to Staging

on:
  push:
    branches:
      - staging # Workflow otomatis berjalan saat ada push/merge ke branch staging
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy to Staging VPS
    runs-on: ubuntu-latest
    steps:
      - name: Execute Deployment Commands via SSH
        uses: appleboy/ssh-action@v1.0.3
        env:
          # Mengambil data .env dari GitHub Secrets
          ENV_FILE_CONTENT: ${{ secrets.STAGING_ENV_FILE }}
        with:
          host: ${{ secrets.STAGING_HOST }}
          username: ${{ secrets.STAGING_USERNAME }}
          key: ${{ secrets.STAGING_SSH_KEY }}
          port: ${{ secrets.STAGING_PORT }}
          envs: ENV_FILE_CONTENT
          script: |
            # 1. Masuk ke direktori staging yang tepat
            cd /home/uxioserver1/web-topup/api/staging

            # 2. Tarik kode terbaru dari branch staging
            git pull origin staging

            # 3. Tulis ulang file .env dari GitHub Secrets
            echo "$ENV_FILE_CONTENT" > .env

            # 4. Install dependensi (mengabaikan interaksi manual)
            composer install --no-interaction --prefer-dist --optimize-autoloader

            # 5. Jalankan migrasi database
            php artisan migrate --force

            # 6. Bersihkan dan buat ulang cache konfigurasi
            php artisan optimize:clear
            php artisan config:cache
            php artisan route:cache

            # 7. Pastikan permission tetap aman setelah file baru turun
            sudo chown -R uxioserver1:www-data /home/uxioserver1/web-topup/api/staging
            sudo chmod -R 775 /home/uxioserver1/web-topup/api/staging/storage
            sudo chmod -R 775 /home/uxioserver1/web-topup/api/staging/bootstrap/cache

            # 8. Deploy supervisor config untuk queue worker
            sudo cp /home/uxioserver1/web-topup/api/staging/supervisor/laravel-queue-staging.conf \
                    /etc/supervisor/conf.d/laravel-queue-staging.conf

            # 9. Reload supervisor agar membaca config terbaru
            sudo supervisorctl reread
            sudo supervisorctl update

            # 10. Restart queue worker agar muat kode yang baru di-deploy
            # (queue:work meng-cache kode — harus restart setiap deploy)
            sudo supervisorctl restart laravel-queue-staging:*
