name: Deploy API to Production

on:
  push:
    branches:
      - main # Workflow otomatis berjalan saat ada push/merge ke branch main
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy to Production VPS
    runs-on: ubuntu-latest
    steps:
      - name: Execute Deployment Commands via SSH
        uses: appleboy/ssh-action@v1.0.3
        env:
          # Mengambil data .env dari GitHub Secrets
          ENV_FILE_CONTENT: ${{ secrets.PROD_ENV_FILE }}
        with:
          host: ${{ secrets.PROD_HOST }}
          username: ${{ secrets.PROD_USERNAME }}
          key: ${{ secrets.PROD_SSH_KEY }}
          port: ${{ secrets.PROD_PORT }}
          envs: ENV_FILE_CONTENT
          script: |
            # 1. Masuk ke direktori production yang tepat
            cd /home/uxioserver1/web-topup/api/prod

            # 2. Tarik kode terbaru dari branch main
            git pull origin main

            # 3. Tulis ulang file .env dari GitHub Secrets
            echo "$ENV_FILE_CONTENT" > .env

            # 4. Install dependensi (mengabaikan interaksi manual)
            composer install --no-interaction --prefer-dist --optimize-autoloader

            # 5. Jalankan migrasi database
            php artisan migrate --force

            # 6. Bersihkan dan buat ulang cache konfigurasi
            php artisan optimize:clear
            php artisan config:cache
            php artisan route:cache

            # 7. Pastikan permission tetap aman setelah file baru turun
            sudo chown -R uxioserver1:www-data /home/uxioserver1/web-topup/api/prod
            sudo chmod -R 775 /home/uxioserver1/web-topup/api/prod/storage
            sudo chmod -R 775 /home/uxioserver1/web-topup/api/prod/bootstrap/cache

            # 8. Install supervisor jika belum ada
            if ! command -v supervisorctl &> /dev/null; then
              echo "Supervisor not found — installing..."
              sudo apt-get update -qq
              sudo apt-get install -y -qq supervisor
              sudo systemctl enable supervisor
              sudo systemctl start supervisor
            else
              echo "Supervisor already installed — skipping install"
            fi

            # 9. Pastikan direktori conf.d ada
            sudo mkdir -p /etc/supervisor/conf.d

            # 10. Deploy supervisor config untuk queue worker
            sudo cp /home/uxioserver1/web-topup/api/prod/supervisor/laravel-queue-prod.conf \
                    /etc/supervisor/conf.d/laravel-queue-prod.conf

            # 11. Reload supervisor agar membaca config terbaru
            sudo supervisorctl reread
            sudo supervisorctl update

            # 12. Restart queue worker agar muat kode yang baru di-deploy
            # (queue:work meng-cache kode — harus restart setiap deploy)
            sudo supervisorctl restart laravel-queue-prod:*
