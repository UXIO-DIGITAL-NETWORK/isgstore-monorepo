name: Deploy API to Production

on:
  push:
    branches:
      - main # Workflow otomatis berjalan saat ada push/merge ke branch main
  workflow_dispatch:

jobs:
  test:
    name: Run Test Suite
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP 8.4
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          # gd + exif back App\Services\ImageOptimizer: uploads are re-encoded to WebP,
          # and UploadedFile::fake()->image() in the suite needs GD to exist.
          extensions: sqlite3, pdo_sqlite, gd, exif
          coverage: none

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist

      - name: Prepare test environment
        run: |
          cp .env.example .env
          php artisan key:generate

      # Test suite uses in-memory SQLite (phpunit.xml) — no services needed.
      - name: Run tests
        run: php artisan test

      - name: Notify Discord — tests failed
        if: failure()
        continue-on-error: true
        env:
          DISCORD_URL: ${{ secrets.DISCORD_WEBHOOK_LOG_URL }}
          GH_ACTOR: ${{ github.actor }}
          GH_REF: ${{ github.ref_name }}
          GH_RUN_ID: ${{ github.run_id }}
          GH_REPO: ${{ github.repository }}
        run: |
          [ -z "$DISCORD_URL" ] && exit 0
          curl -sf -o /dev/null -X POST "$DISCORD_URL" \
            -H "Content-Type: application/json" \
            -d "{\"embeds\":[{\"title\":\"❌ Production Tests Failed\",\"description\":\"**${GH_ACTOR}** — test suite failed on **${GH_REF}**\nhttps://github.com/${GH_REPO}/actions/runs/${GH_RUN_ID}\",\"color\":15548997,\"footer\":{\"text\":\"Uxio System Auto-Log\"}}]}" || true

  deploy:
    name: Deploy to Production VPS
    runs-on: ubuntu-latest
    needs: test # Deploy hanya berjalan jika seluruh test suite hijau
    steps:
      - name: Notify Discord — deploy started
        continue-on-error: true
        env:
          DISCORD_URL: ${{ secrets.DISCORD_WEBHOOK_LOG_URL }}
          GH_ACTOR: ${{ github.actor }}
          GH_REF: ${{ github.ref_name }}
          GH_SHA: ${{ github.sha }}
          GH_RUN_ID: ${{ github.run_id }}
          GH_REPO: ${{ github.repository }}
        run: |
          [ -z "$DISCORD_URL" ] && exit 0
          curl -sf -o /dev/null -X POST "$DISCORD_URL" \
            -H "Content-Type: application/json" \
            -d "{\"embeds\":[{\"title\":\"🚀 Production Deploy Started\",\"description\":\"**${GH_ACTOR}** deploying **${GH_SHA:0:7}** on **${GH_REF}**\nhttps://github.com/${GH_REPO}/actions/runs/${GH_RUN_ID}\",\"color\":16705372,\"footer\":{\"text\":\"Uxio System Auto-Log\"}}]}" || true

      - name: Execute Deployment Commands via SSH
        uses: appleboy/ssh-action@v1.0.3
        env:
          # Mengambil data .env dari GitHub Secrets
          ENV_FILE_CONTENT: ${{ secrets.PROD_ENV_FILE }}
        with:
          host: ${{ secrets.PROD_HOST }}
          username: ${{ secrets.PROD_USERNAME }}
          key: ${{ secrets.PROD_SSH_KEY }}
          port: ${{ secrets.PROD_PORT }}
          envs: ENV_FILE_CONTENT
          script: |
            # 0. Bootstrap: clone repo on first deploy if prod dir isn't a git repo yet
            # Updated to uxioserver1 path
            PROD_DIR="/home/uxioserver1/web-topup/api/prod"
            if [ ! -d "$PROD_DIR/.git" ]; then
              echo "First-time setup: removing stale dir and cloning repo into $PROD_DIR..."
              rm -rf "$PROD_DIR"
              git clone git@github.com:UXIO-DIGITAL-NETWORK/web-topup-api.git "$PROD_DIR"
              git -C "$PROD_DIR" checkout main
            fi

            # 1. Masuk ke direktori production yang tepat
            cd /home/uxioserver1/web-topup/api/prod

            # 2. Tarik kode terbaru dari branch main
            git pull origin main || { echo "::error::git pull gagal — deploy dibatalkan sebelum kode lama ter-cache ulang."; exit 1; }

            # 3. Tulis ulang file .env dari GitHub Secrets
            echo "$ENV_FILE_CONTENT" > .env

            # 4. Install dependensi (tanpa dev packages di production)
            composer install --no-interaction --prefer-dist --optimize-autoloader --no-dev

            # 5. Jalankan migrasi database
            php artisan migrate --force

            # 6. Bersihkan dan buat ulang cache konfigurasi
            php artisan optimize:clear
            php artisan config:cache
            php artisan route:cache

            # 7. Pastikan symlink storage publik ada (logo kategori, banner)
            php artisan storage:link || true

            # 8. Pastikan permission tetap aman setelah file baru turun
            # Updated user/group and paths to uxioserver1
            sudo chown -R uxioserver1:www-data /home/uxioserver1/web-topup/api/prod
            sudo chmod -R 775 /home/uxioserver1/web-topup/api/prod/storage
            sudo chmod -R 775 /home/uxioserver1/web-topup/api/prod/bootstrap/cache

            # 8b. Reload PHP-FPM agar proses web memuat kode yang baru turun.
            # Langkah 12-14 hanya me-restart queue worker; pool PHP-FPM yang melayani
            # HTTP tidak pernah disentuh. Dengan OPcache aktif, pool itu terus
            # mengeksekusi bytecode rilis sebelumnya walau file di disk sudah baru —
            # deploy "sukses" tapi API masih menjawab dengan kode lama (mis. rilis
            # split services.price: FE mengirim cost_price/selling_price, API lama
            # tetap menolak dengan 422 "The price field is required").
            FPM_UNIT=$(systemctl list-units --type=service --state=running --no-legend 'php*-fpm.service' 2>/dev/null | awk '{print $1}' | head -1)
            if [ -n "$FPM_UNIT" ]; then
              sudo systemctl reload "$FPM_UNIT"
              echo "Reloaded $FPM_UNIT"
            else
              echo "::warning::Tidak menemukan php*-fpm.service yang berjalan — kode baru mungkin belum aktif di proses web."
            fi

            # 9. Pasang cron Laravel scheduler (idempotent, spesifik per environment).
            # Updated cron path to uxioserver1
            CRON_ENTRY="* * * * * cd /home/uxioserver1/web-topup/api/prod && php artisan schedule:run >> /dev/null 2>&1"
            ( crontab -l 2>/dev/null | grep -vF "web-topup/api/prod && php artisan schedule:run" ; echo "$CRON_ENTRY" ) | crontab -
            echo "Scheduler cron installed:"
            crontab -l | grep "schedule:run"

            # 10. Install supervisor jika belum ada
            if ! command -v supervisorctl &> /dev/null; then
              echo "Supervisor not found — installing..."
              sudo apt-get update -qq
              sudo apt-get install -y -qq supervisor
              sudo systemctl enable supervisor
            else
              echo "Supervisor already installed — skipping install"
            fi

            # 11. Pastikan direktori conf.d ada
            sudo mkdir -p /etc/supervisor/conf.d

            # 12. Deploy supervisor config untuk queue worker
            # Updated source file path to uxioserver1
            # (dilakukan sebelum daemon start/health-check di bawah — config yang salah
            # di conf.d bisa membuat seluruh supervisord gagal start, jadi config terbaru
            # harus sudah ter-copy sebelum kita mencoba (re)start daemonnya)
            sudo cp /home/uxioserver1/web-topup/api/prod/supervisor/laravel-queue-prod.conf \
                    /etc/supervisor/conf.d/laravel-queue-prod.conf

            # Pastikan daemon supervisord benar-benar berjalan (idempotent — no-op jika sudah up).
            # Binary bisa saja sudah terpasang tapi daemonnya mati/belum pernah dijalankan.
            if ! sudo systemctl is-active --quiet supervisor; then
              echo "supervisord not running — starting..."
              sudo systemctl restart supervisor
              sleep 2
            fi

            if [ ! -S /var/run/supervisor.sock ]; then
              echo "ERROR: supervisor.sock still missing after start attempt — check 'systemctl status supervisor' / 'journalctl -u supervisor' on the host."
              exit 1
            fi

            # 13. Reload supervisor agar membaca config terbaru
            sudo supervisorctl reread
            sudo supervisorctl update

            # 14. Restart queue worker agar muat kode yang baru di-deploy
            sudo supervisorctl restart laravel-queue-prod:*

      - name: Notify Discord — deploy succeeded
        if: success()
        continue-on-error: true
        env:
          DISCORD_URL: ${{ secrets.DISCORD_WEBHOOK_LOG_URL }}
          GH_ACTOR: ${{ github.actor }}
          GH_REF: ${{ github.ref_name }}
          GH_SHA: ${{ github.sha }}
          GH_RUN_ID: ${{ github.run_id }}
          GH_REPO: ${{ github.repository }}
        run: |
          [ -z "$DISCORD_URL" ] && exit 0
          curl -sf -o /dev/null -X POST "$DISCORD_URL" \
            -H "Content-Type: application/json" \
            -d "{\"embeds\":[{\"title\":\"✅ Production Deploy Succeeded\",\"description\":\"**${GH_SHA:0:7}** on **${GH_REF}** deployed by **${GH_ACTOR}**\nhttps://github.com/${GH_REPO}/actions/runs/${GH_RUN_ID}\",\"color\":5763719,\"footer\":{\"text\":\"Uxio System Auto-Log\"}}]}" || true

      - name: Notify Discord — deploy failed
        if: failure()
        continue-on-error: true
        env:
          DISCORD_URL: ${{ secrets.DISCORD_WEBHOOK_LOG_URL }}
          GH_ACTOR: ${{ github.actor }}
          GH_REF: ${{ github.ref_name }}
          GH_SHA: ${{ github.sha }}
          GH_RUN_ID: ${{ github.run_id }}
          GH_REPO: ${{ github.repository }}
        run: |
          [ -z "$DISCORD_URL" ] && exit 0
          curl -sf -o /dev/null -X POST "$DISCORD_URL" \
            -H "Content-Type: application/json" \
            -d "{\"embeds\":[{\"title\":\"❌ Production Deploy Failed\",\"description\":\"**${GH_ACTOR}** — deploy of **${GH_SHA:0:7}** on **${GH_REF}** failed!\nhttps://github.com/${GH_REPO}/actions/runs/${GH_RUN_ID}\",\"color\":15548997,\"footer\":{\"text\":\"Uxio System Auto-Log\"}}]}" || true