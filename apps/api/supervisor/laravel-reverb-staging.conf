[program:laravel-reverb-staging]
process_name=%(program_name)s_%(process_num)02d
; Port 8081 so prod (8080) and staging can coexist on the same VPS.
; The staging .env must set REVERB_SERVER_PORT=8081 and REVERB_PORT=8081 so the
; backend publishes to the same port this server binds.
command=php /home/uxioserver1/web-topup/api/staging/artisan reverb:start --host=0.0.0.0 --port=8081
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
user=uxioserver1
numprocs=1
redirect_stderr=true
stdout_logfile=/home/uxioserver1/web-topup/api/staging/storage/logs/reverb.log
stopwaitsecs=10
