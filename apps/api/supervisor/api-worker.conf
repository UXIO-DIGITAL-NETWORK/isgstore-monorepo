; Supervisor program for this site's queue worker — ONE per environment.
;
; NOT optional in production. Eight job classes run on the database queue, and
; the most important of them — ProcessUxiolabsTopup — is what actually places a
; paid customer's order with the supplier. If this worker is down the customer
; pays, the job parks in `jobs`, and nothing anywhere errors. `queue:health`
; (scheduled every 10 minutes) exists to make that silence audible.
;
; TEMPLATE — not usable as-is. __API_DIR__, __DEPLOY_USER__ and __SLOT__ are
; substituted by .github/workflows/deploy-{prod,staging}.yml, which render this
; file into /etc/supervisor/conf.d and verify the program actually reaches
; RUNNING. The paths are NOT hardcoded on purpose: the deploy root is one secret
; (DEPLOY_BASE_PATH) per environment, so a site deployed under a different root
; gets a correct worker without editing this file.
;
; ONE PROGRAM PER ENVIRONMENT. Production and staging share a server and a
; deploy user, so the program name must be unique — otherwise the second deploy
; rewrites the first's conf and repoints ITS worker (silently: the other site's
; paid orders stop reaching the supplier). __SLOT__ is the environment
; (production | staging); the file lands as api-<slot>-worker.conf and the
; program as api-<slot>-worker.
[program:api-__SLOT__-worker]
process_name=%(program_name)s_%(process_num)02d
command=php __API_DIR__/artisan queue:work database --sleep=3 --tries=3 --timeout=90 --max-jobs=500 --max-time=3600
directory=__API_DIR__
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
user=__DEPLOY_USER__
; Two processes, not one. Every job type shares this queue, and a supplier order
; is an outbound HTTP call that can hold a worker for seconds — with a single
; process a Hub config poke waits behind it, which is the difference between
; "fee changes land in ~2 seconds" and "fee changes land eventually".
numprocs=2
redirect_stderr=true
stdout_logfile=__API_DIR__/storage/logs/worker.log
stdout_logfile_maxbytes=50MB
stdout_logfile_backups=5
; Long enough for an in-flight supplier order to finish on `queue:restart`
; rather than being killed mid-call, which would leave the order ambiguous.
stopwaitsecs=120
