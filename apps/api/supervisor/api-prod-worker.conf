; Supervisor program for this site's queue worker.
;
; NOT optional in production. Eight job classes run on the database queue, and
; the most important of them — ProcessUxiotopupTopup — is what actually places a
; paid customer's order with the supplier. If this worker is down the customer
; pays, the job parks in `jobs`, and nothing anywhere errors. `queue:health`
; (scheduled every 10 minutes) exists to make that silence audible.
;
; Deployed by .github/workflows/deploy-prod.yml, which copies this file into
; /etc/supervisor/conf.d and verifies the program actually reaches RUNNING.
[program:api-prod-worker]
process_name=%(program_name)s_%(process_num)02d
command=php /home/uxioserver1/web-topup-uxiotopup-provider/api/artisan queue:work database --sleep=3 --tries=3 --timeout=90 --max-jobs=500 --max-time=3600
directory=/home/uxioserver1/web-topup-uxiotopup-provider/api
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
user=uxioserver1
; Two processes, not one. Every job type shares this queue, and a supplier order
; is an outbound HTTP call that can hold a worker for seconds — with a single
; process a Hub config poke waits behind it, which is the difference between
; "fee changes land in ~2 seconds" and "fee changes land eventually".
numprocs=2
redirect_stderr=true
stdout_logfile=/home/uxioserver1/web-topup-uxiotopup-provider/api/storage/logs/worker.log
stdout_logfile_maxbytes=50MB
stdout_logfile_backups=5
; Long enough for an in-flight supplier order to finish on `queue:restart`
; rather than being killed mid-call, which would leave the order ambiguous.
stopwaitsecs=120
